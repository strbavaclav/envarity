<svg viewBox="0 0 800 110" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow-normal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="arrow-flag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d1453b"/>
    </marker>
    <symbol id="file-icon" viewBox="0 0 16 20">
      <path d="M2,0 H10 L14,4 V20 H2 Z" fill="#ffffff" stroke="#6b7280" stroke-width="1.3"/>
      <path d="M10,0 V4 H14" fill="none" stroke="#6b7280" stroke-width="1.3"/>
      <line x1="4" y1="9" x2="12" y2="9" stroke="#6b7280" stroke-width="1"/>
      <line x1="4" y1="12" x2="12" y2="12" stroke="#6b7280" stroke-width="1"/>
      <line x1="4" y1="15" x2="10" y2="15" stroke="#6b7280" stroke-width="1"/>
    </symbol>
  </defs>

  <g font-size="13" text-anchor="middle">
    <rect x="0" y="30" width="140" height="50" rx="8" fill="#eef2f6" stroke="#9aa5b1" stroke-width="1.5"/>
    <use href="#file-icon" x="62" y="34" width="16" height="16"/>
    <text x="70" y="72" fill="#1f2937">test</text>

    <rect x="220" y="30" width="140" height="50" rx="8" fill="#eef2f6" stroke="#9aa5b1" stroke-width="1.5"/>
    <use href="#file-icon" x="282" y="34" width="16" height="16"/>
    <text x="290" y="72" fill="#1f2937">preprod</text>

    <rect x="440" y="30" width="140" height="50" rx="8" fill="#eef2f6" stroke="#9aa5b1" stroke-width="1.5"/>
    <use href="#file-icon" x="502" y="34" width="16" height="16"/>
    <text x="510" y="72" fill="#1f2937">staging</text>

    <rect x="660" y="30" width="140" height="50" rx="8" fill="#eef2f6" stroke="#9aa5b1" stroke-width="1.5"/>
    <use href="#file-icon" x="722" y="34" width="16" height="16"/>
    <text x="730" y="72" fill="#1f2937">production</text>
  </g>

  <line x1="140" y1="55" x2="212" y2="55" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow-normal)"/>
  <line x1="360" y1="55" x2="432" y2="55" stroke="#d1453b" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow-flag)"/>
  <line x1="580" y1="55" x2="652" y2="55" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow-normal)"/>

  <g font-size="12" text-anchor="middle">
    <text x="176" y="20" fill="#6b7280">promote</text>
    <text x="396" y="20" fill="#d1453b" font-weight="bold">missed &amp; flagged</text>
    <text x="616" y="20" fill="#6b7280">promote</text>
  </g>
</svg>
